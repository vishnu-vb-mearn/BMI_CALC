<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BMI Calculator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-dark">
    <div class="container mt-5">
      <div
        class="bg-primary border-light text-light card shadow-sm p-4 mx-auto"
        style="max-width: 350px"
      >
        <h3 class="text-center mb-4">BMI Calculator</h3>

        <input
          type="number"
          id="height"
          class="form-control mb-3"
          placeholder="Height (cm)"
        />

        <input
          type="number"
          id="weight"
          class="form-control mb-3"
          placeholder="Weight (kg)"
        />

        <button onclick="onCalculate()" class="btn btn-outline-light w-100">
          Calculate
        </button>
      </div>

      <div
        class="bg-success text-dark border-light card shadow-sm p-4 mt-4 mx-auto text-center"
        style="max-width: 350px"
      >
        <div id="result">
          <p class="mb-1">BMI</p>

          <h4 id="bmiValue">No data</h4>

          <p id="bmiCategory" class="mb-0"></p>
        </div>

        <button onclick="onDelete()" class="btn btn-outline-warning mt-3">
          Delete
        </button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
